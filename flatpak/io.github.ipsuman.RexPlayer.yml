app-id: io.github.ipsuman.RexPlayer
runtime: org.kde.Platform
runtime-version: '6.9'
sdk: org.kde.Sdk
command: rex-player
finish-args:
  - --share=ipc
  - --share=network
  - --socket=x11
  - --socket=pulseaudio
  - --device=dri
  - --filesystem=home
  - --talk-name=org.freedesktop.Notifications
modules:
  - name: ffmpeg
    buildsystem: simple
    build-commands:
      - ./configure --prefix=/app --disable-programs --disable-doc --disable-debug --disable-static --enable-shared --enable-pic
      - make -j$FLATPAK_BUILDER_N_JOBS
      - make install
    cleanup:
      - /include
      - /lib/pkgconfig
      - /share
    sources:
      - type: git
        url: https://github.com/FFmpeg/FFmpeg.git
        tag: n7.1.1
  - name: mpv
    buildsystem: simple
    build-commands:
      - meson setup build --prefix=/app --libdir=lib -Dlibmpv=true -Dcplayer=false -Dtests=false -Dmanpage-build=disabled -Dhtml-build=disabled -Dpdf-build=disabled -Dlua=disabled -Djavascript=disabled -Dlibass=disabled -Dlibarchive=disabled -Dlibplacebo=disabled -Dvaapi=disabled -Dvdpau=disabled -Ddrm=disabled -Dgbm=disabled -Dwayland=disabled -Dx11=enabled -Dalsa=disabled -Djack=disabled -Dpipewire=disabled -Dpulse=disabled -Dsdl2=disabled -Duchardet=disabled -Dzimg=disabled -Dvapoursynth=disabled -Dshaderc=disabled -Dvulkan=disabled
      - meson compile -C build
      - meson install -C build
    cleanup:
      - /include
      - /lib/pkgconfig
      - /share
    sources:
      - type: git
        url: https://github.com/mpv-player/mpv.git
        tag: v0.40.0
  - name: rex-player
    buildsystem: simple
    build-commands:
      - cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/app -DCMAKE_PREFIX_PATH=/app
      - cmake --build build --parallel $FLATPAK_BUILDER_N_JOBS
      - cmake --install build
      - mv /app/bin/rex-player /app/bin/rex-player-bin
      - install -Dm755 rex-player-launcher.sh /app/bin/rex-player
      - install -Dm644 assets/rex-player.desktop /app/share/applications/io.github.ipsuman.RexPlayer.desktop
      - install -Dm644 assets/rex-player.svg /app/share/icons/hicolor/scalable/apps/io.github.ipsuman.RexPlayer.svg
    sources:
      - type: dir
        path: ..
