name: Build MPV-Linux

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config qt6-base-dev libmpv-dev ffmpeg dpkg-dev

      - name: Configure
        run: cmake -S . -B build-linux -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build-linux --parallel

      - name: Package portable archive
        run: |
          mkdir -p dist/mpv-linux
          cp build-linux/rex-player dist/mpv-linux/rex-player-bin
          cp rex-player-launcher.sh dist/mpv-linux/rex-player
          chmod +x dist/mpv-linux/rex-player
          cp README.md dist/mpv-linux/
          cp assets/mpv-linux.svg dist/mpv-linux/
          tar -C dist -czf mpv-linux.tar.gz mpv-linux

      - name: Build Debian package
        run: |
          PKGROOT="$PWD/dist/deb/mpv-linux"
          mkdir -p "$PKGROOT/DEBIAN" "$PKGROOT/usr/bin" "$PKGROOT/usr/share/applications" "$PKGROOT/usr/share/icons/hicolor/scalable/apps"
          cp build-linux/rex-player "$PKGROOT/usr/bin/rex-player-bin"
          cp rex-player-launcher.sh "$PKGROOT/usr/bin/rex-player"
          cp assets/mpv-linux.svg "$PKGROOT/usr/share/icons/hicolor/scalable/apps/mpv-linux.svg"
          chmod 755 "$PKGROOT/usr/bin/rex-player" "$PKGROOT/usr/bin/rex-player-bin"
          cat > "$PKGROOT/DEBIAN/control" <<'EOF'
          Package: mpv-linux
          Version: 0.1.0
          Section: video
          Priority: optional
          Architecture: amd64
          Maintainer: MPV-Linux Project
          Description: Lightweight Qt6/libmpv media player for Linux
           A native desktop media player frontend around libmpv.
          Depends: libqt6widgets6, libmpv2, ffmpeg
          EOF
          cat > "$PKGROOT/usr/share/applications/mpv-linux.desktop" <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=MPV-L!nux
          Comment=Lightweight libmpv media player
          Exec=rex-player %U
          Icon=mpv-linux
          Terminal=false
          Categories=AudioVideo;Player;Video;
          MimeType=video/mp4;video/x-matroska;video/webm;video/quicktime;audio/mpeg;audio/ogg;audio/flac;
          StartupNotify=true
          EOF
          dpkg-deb --build --root-owner-group "$PKGROOT" dist/mpv-linux_0.1.0_amd64.deb

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mpv-linux-installers
          path: |
            mpv-linux.tar.gz
            dist/mpv-linux_0.1.0_amd64.deb
          retention-days: 30
