name: Windows Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up MSYS2 UCRT64
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-qt6-base
            mingw-w64-ucrt-x86_64-mpv
            mingw-w64-ucrt-x86_64-ffmpeg
            mingw-w64-ucrt-x86_64-imagemagick

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$PWD/dist"

      - name: Build
        run: cmake --build build --parallel

      - name: Install
        run: cmake --install build

      - name: Deploy Qt and libmpv runtime
        run: |
          mkdir -p dist/bin
          /ucrt64/bin/windeployqt6.exe \
            --release \
            --no-translations \
            --no-system-d3d-compiler \
            dist/bin/rex-player.exe

          copy_deps() {
            local target="$1"
            [ -f "$target" ] || return 0
            ldd "$target" | awk '/=>/ && $3 ~ /^\/ucrt64\/bin\/.*\.dll$/ {print $3}' | while read -r dll; do
              [ -f "$dll" ] && cp -n "$dll" dist/bin/
            done
          }

          # windeployqt deploys the Qt runtime, but MinGW runtime DLLs are
          # compiler dependencies and must also be shipped with the portable
          # application. Recursively collect UCRT64 DLL dependencies so the
          # portable folder does not depend on the build machine's MSYS2 path.
          copy_deps dist/bin/rex-player.exe
          copy_deps "$MPV_DLL"
          [ -f dist/bin/ffmpeg.exe ] && copy_deps dist/bin/ffmpeg.exe

          for pass in 1 2 3; do
            for dll in dist/bin/*.dll; do
              [ -f "$dll" ] && copy_deps "$dll"
            done
          done

          # Keep the core MinGW runtime libraries explicit as a final safety
          # net. These are the libraries reported missing when the compiler
          # runtime is not present beside the executable.
          for runtime in libgcc_s_seh-1.dll libstdc++-6.dll libwinpthread-1.dll; do
            if [ -f "/ucrt64/bin/$runtime" ]; then
              cp -n "/ucrt64/bin/$runtime" dist/bin/
            fi
          done

          MPV_DLL=""
          for candidate in /ucrt64/bin/libmpv-2.dll /ucrt64/bin/mpv-2.dll; do
            if [ -f "$candidate" ]; then
              MPV_DLL="$candidate"
              break
            fi
          done
          if [ -z "$MPV_DLL" ]; then
            echo "libmpv DLL not found"
            exit 1
          fi
          cp "$MPV_DLL" dist/bin/

          if [ -f /ucrt64/bin/ffmpeg.exe ]; then
            cp /ucrt64/bin/ffmpeg.exe dist/bin/
          fi

      - name: Build Windows installer
        shell: powershell
        run: |
          choco install nsis -y --no-progress
          New-Item -ItemType Directory -Force -Path release | Out-Null
          & "C:\Program Files (x86)\NSIS\makensis.exe" "packaging\windows\REX-Player.nsi"
          if ($LASTEXITCODE -ne 0) {
            throw "NSIS installer build failed with exit code $LASTEXITCODE"
          }

      - name: Create installer ZIP
        shell: powershell
        run: |
          Compress-Archive -Path "release\REX-Player-Windows-x64-setup.exe" -DestinationPath "release\REX-Player-Windows-x64.zip" -Force

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: REX-Player-Windows-x64
          path: release/REX-Player-Windows-x64.zip

      - name: Upload portable folder
        uses: actions/upload-artifact@v4
        with:
          name: REX-Player-Windows-x64-folder
          path: dist/bin/
